services:
  - type: web
    name: smart-wardrobe-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: DEVICE_TOKEN
        generateValue: true
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
