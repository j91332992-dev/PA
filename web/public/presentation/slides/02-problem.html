<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WARDROBE - Problem</title>
<style>
  :root { --ink:#070a0f; --line:rgba(255,255,255,.12); --muted:#8b96a8; --orange:#ffb86b; }
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:#f5f7f8;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif}
  .grid{position:fixed;inset:0;opacity:.3;background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:62px 62px;mask-image:linear-gradient(to bottom,black,transparent 92%)}
  .glow{position:fixed;width:42vw;height:42vw;border-radius:50%;filter:blur(100px);background:#ff7a59;opacity:.13;right:-15%;top:-18%}
  .wrap{position:relative;z-index:2;min-height:100vh;padding:12vh 8vw 9vh;display:grid;grid-template-columns:1.15fr .85fr;gap:7vw;align-items:center}
  .kicker{color:var(--orange);font-size:11px;font-weight:800;letter-spacing:.2em;opacity:0}
  h1{margin:22px 0 30px;font-size:clamp(54px,7.4vw,116px);line-height:.95;letter-spacing:-.075em;font-weight:900;opacity:0}
  h1 em{font-style:normal;color:var(--orange)}
  .question{display:inline-flex;gap:10px;align-items:center;color:#c5cdd7;font-size:clamp(18px,2vw,28px);font-weight:650;opacity:0}
  .question::before{content:"?";display:grid;place-items:center;width:36px;height:36px;border:1px solid rgba(255,184,107,.6);border-radius:50%;color:var(--orange)}
  .time-card{position:relative;padding:42px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025));border-radius:28px;box-shadow:0 30px 90px rgba(0,0,0,.28);opacity:0;transform:translateY(26px)}
  .time-card::before{content:"MORNING SEARCH";color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.18em}
  .time{display:flex;align-items:baseline;gap:10px;margin:20px 0 8px;font-size:clamp(70px,9vw,142px);line-height:.85;letter-spacing:-.09em;font-weight:900}
  .time strong{color:var(--orange)} .time span{font-size:16px;letter-spacing:.12em;color:var(--muted)}
  .time-card p{margin:0;color:#c2cad4;font-size:15px;line-height:1.6}
  .bar{height:5px;margin:30px 0 20px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;width:72%;border-radius:99px;background:linear-gradient(90deg,var(--orange),#ff6d6d);transform-origin:left}
  .notes{display:grid;gap:12px;margin-top:34px}.note{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px;opacity:0;transform:translateX(-14px)}.note b{color:#f5f7f8;font-size:14px}.note i{width:7px;height:7px;border-radius:50%;background:var(--orange)}
  .bottom{position:fixed;left:8vw;right:8vw;bottom:28px;display:flex;justify-content:space-between;z-index:3;color:var(--muted);font-size:11px;letter-spacing:.08em}.bottom strong{color:#f5f7f8}
  @media(max-width:850px){.wrap{grid-template-columns:1fr;padding-top:15vh;gap:4vh}.time-card{padding:26px}.notes{margin-top:18px}.bottom{left:18px;right:18px}.bottom span{display:none}}
</style>
<link rel="stylesheet" href="../presentation-theme.css">
</head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <main class="wrap">
    <section>
      <div class="kicker">01 / THE PROBLEM</div>
      <h1>옷장은 옷을<br><em>기억하지 못한다.</em></h1>
      <div class="question">내 흰 셔츠는 어디에 있을까?</div>
      <div class="notes">
        <div class="note"><i></i><span><b>찾는 시간</b>이 길어질수록 아침은 늦어진다.</span></div>
        <div class="note"><i></i><span><b>손의 기억</b>에 의존할수록 위치는 사라진다.</span></div>
        <div class="note"><i></i><span><b>옷장 안에 있다는 사실</b>만으로는 충분하지 않다.</span></div>
      </div>
    </section>
    <aside class="time-card">
      <div class="time"><strong>10–30</strong><span>MIN</span></div>
      <p>매일 아침, 한 벌을 찾기 위해<br>반복되는 작은 탐색 비용</p>
      <div class="bar"><i></i></div>
      <p style="color:var(--orange);font-weight:700">문제는 옷이 아니라 ‘위치 정보’입니다.</p>
    </aside>
  </main>
  <div class="bottom"><span>SMART WARDROBE / INSIGHT</span><strong>위치를 기억하는 옷장</strong></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
  <script>
    if (window.gsap) {
      gsap.timeline({defaults:{ease:'power3.out'}})
        .to('.kicker',{opacity:1,duration:.45})
        .to('h1',{opacity:1,y:0,duration:.85},'-.1')
        .to('.question',{opacity:1,x:0,duration:.55},'-.35')
        .to('.note',{opacity:1,x:0,duration:.45,stagger:.12},'-.15')
        .to('.time-card',{opacity:1,y:0,duration:.8},'-.6')
        .fromTo('.bar i',{scaleX:0},{scaleX:1,duration:1.1,ease:'power2.out'},'-.35');
    } else document.querySelectorAll('.kicker,h1,.question,.note,.time-card').forEach(function(el){el.style.opacity=1});
    if (window.anime) anime({targets:'.glow',translateX:[-20,20],translateY:[10,-10],duration:9000,easing:'easeInOutSine',direction:'alternate',loop:true});
  </script>
</body>
</html>
