<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WARDROBE - Close</title>
<style>
  :root{--ink:#070a0f;--line:rgba(255,255,255,.12);--muted:#8b96a8;--signal:#2f78d0}
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:#f5f7f8;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif}
  body::before{content:"";position:fixed;inset:0;opacity:.27;background:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(to bottom,black,transparent 85%)}
  .orb{position:fixed;left:50%;top:45%;width:38vw;height:38vw;transform:translate(-50%,-50%);border:1px solid rgba(47,120,208,.25);border-radius:50%;box-shadow:0 0 100px rgba(47,120,208,.1),inset 0 0 100px rgba(47,120,208,.06)}.orb::before,.orb::after{content:"";position:absolute;inset:12%;border:1px dashed rgba(47,120,208,.18);border-radius:50%}.orb::after{inset:27%;border-style:solid;border-color:rgba(255,255,255,.1)}
  .center{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;text-align:center;padding:9vh 18px}.kicker{color:var(--signal);font-size:11px;font-weight:800;letter-spacing:.2em;opacity:0}.signal{display:inline-flex;align-items:center;gap:9px;margin-top:35px;padding:10px 14px;border:1px solid rgba(47,120,208,.35);border-radius:999px;color:var(--signal);background:rgba(47,120,208,.08);font-size:11px;font-weight:800;letter-spacing:.12em;opacity:0}.signal i{width:7px;height:7px;border-radius:50%;background:var(--signal);box-shadow:0 0 16px var(--signal)}
  h1{margin:28px 0 24px;font-size:clamp(52px,8vw,126px);line-height:.91;letter-spacing:-.085em;font-weight:900;opacity:0}h1 span{color:var(--signal);text-shadow:0 0 40px rgba(47,120,208,.22)}.sub{margin:0 auto;color:#c5ced8;font-size:18px;line-height:1.6;opacity:0}.line{width:80px;height:1px;margin:32px auto;background:linear-gradient(90deg,transparent,var(--signal),transparent);opacity:0}
  .footer{position:fixed;left:8vw;right:8vw;bottom:28px;display:flex;justify-content:space-between;color:var(--muted);font-size:10px;letter-spacing:.1em;z-index:3}.footer b{color:#f5f7f8}
  @media(max-width:850px){.orb{width:80vw;height:80vw}.footer{left:18px;right:18px}.footer span{display:none}}
</style>
<link rel="stylesheet" href="../presentation-theme.css">
</head>
<body>
  <div class="orb"></div>
  <main class="center">
    <section>
      <div class="kicker">06 / THE TAKEAWAY</div>
      <h1>옷을 찾는 시간 대신,<br><span>입는 시간으로.</span></h1>
      <p class="sub">Smart Wardrobe는 옷장에 위치 정보를 부여하고,<br>필요한 순간 한 점의 빛으로 답합니다.</p>
      <div class="line"></div>
      <div class="signal"><i></i> THE WARDROBE ANSWERS</div>
    </section>
  </main>
  <footer class="footer"><span>NFC · ESP-NOW · WEB/PWA · LIVE DEMO</span><b>SMART WARDROBE / 2026</b></footer>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
  <script>
    if(window.gsap){
      gsap.timeline({defaults:{ease:'power3.out'}}).to('.kicker',{opacity:1,duration:.5}).to('h1',{opacity:1,y:0,duration:1},'-.15').to('.sub',{opacity:1,y:0,duration:.65},'-.45').to('.line',{opacity:1,width:120,duration:.5},'-.2').to('.signal',{opacity:1,y:0,duration:.55},'-.15');
    } else document.querySelectorAll('.kicker,h1,.sub,.line,.signal').forEach(function(el){el.style.opacity=1});
    if(window.anime){anime({targets:'.orb',rotate:360,duration:24000,easing:'linear',loop:true});anime({targets:'.signal i',scale:[1,1.5,1],duration:1200,easing:'easeInOutSine',loop:true});}
  </script>
</body>
</html>
